<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<script src="/js/api.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KampusCircle — Teman Setia Kebutuhan Kampus</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>09.41</span>
    <div class="icons">
      <svg viewBox="0 0 24 24"><path d="M2 17h3v5H2zm5-4h3v9H7zm5-4h3v13h-3zm5-5h3v18h-3z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.24 4.24 0 00-6 0zm-4-4l2 2a7.07 7.07 0 0110 0l2-2C15.95 9.05 8.05 9.05 5 13z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </div>
  </div>

  <div class="onboarding-wrap">
    <div class="brand-top-bar">
      <div class="brand-logo-text">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="#008F83" style="margin-right:2px">
          <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zm0 8.5L4.5 9 12 4.91 19.5 9 12 11.5z"/>
        </svg>
        <span class="brand-teal">Kampus</span><span class="brand-orange">Circle</span>
      </div>
      <div style="cursor:pointer;color:var(--text-dark)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </div>
    </div>

    <div class="onboarding-hero-box">
      <img src="/img/onboarding-hero.png" alt="Teman Setia Kebutuhan Kampus">
    </div>

    <h1 class="onboarding-title">Teman Setia<br>Kebutuhan Kampus</h1>
    <p class="onboarding-sub">Barang yang kamu butuhkan, ada di lingkaran kampusmu.</p>

    <div class="onboarding-cards">
      <div class="service-pill-card mint">
        <div class="service-icon">
          <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        </div>
        <div class="service-title">Beli</div>
        <div class="service-desc">Lebih hemat</div>
      </div>
      <div class="service-pill-card peach">
        <div class="service-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="service-title">Sewa</div>
        <div class="service-desc">Sesuai durasi</div>
      </div>
      <div class="service-pill-card mint">
        <div class="service-icon">
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </div>
        <div class="service-title">Pinjam</div>
        <div class="service-desc">Tanpa biaya</div>
      </div>
    </div>

    <p class="onboarding-note">Satu akun untuk mencari dan berbagi barang. Khusus komunitas mahasiswa terverifikasi.</p>

    <div class="onboarding-actions">
      <button id="btnMulaiBergabung" class="btn-primary" onclick="location.href='/verifikasi.html'">Mulai bergabung</button>
      <button id="btnKeMasuk" class="btn-ghost" onclick="location.href='/masuk.html'">Sudah punya akun? Masuk</button>
    </div>

    <div class="home-indicator-bar"></div>
  </div>
</div>
</body>
</html>
