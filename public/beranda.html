<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<script src="/vendor/sweetalert2.all.min.js"></script>
<script src="/js/api.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KampusCircle — Beranda</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .beranda-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: none;
    display: flex;
    flex-direction: column;
    padding-bottom: 80px;
    background: #F8FAFC;
  }
  .beranda-body::-webkit-scrollbar { display: none; }

  /* Teal curved header */
  .teal-header-hero {
    background: var(--primary);
    border-bottom-left-radius: 26px;
    border-bottom-right-radius: 26px;
    padding: 12px 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    color: #FFFFFF;
    position: relative;
    box-shadow: 0 4px 16px rgba(0, 143, 131, 0.15);
  }
  .status-bar-white {
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: #FFFFFF;
  }
  .status-bar-white .status-icons {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .header-top-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .greeting-col {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .greeting-title {
    font-size: 24px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.02em;
  }
  .location-pill-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.9);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 2px 0;
  }
  .location-pill-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }
  .bell-circle-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    flex-shrink: 0;
  }
  .bell-circle-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }

  /* Dual search bars */
  .search-pill-box {
    background: #FFFFFF;
    border-radius: 16px;
    height: 44px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .search-lead-icon {
    width: 18px;
    height: 18px;
    stroke: var(--text-muted);
    fill: none;
    stroke-width: 2;
    flex-shrink: 0;
  }
  .search-pill-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 13px;
    color: var(--text-dark);
    font-family: inherit;
    background: transparent;
  }
  .search-pill-box input::placeholder {
    color: var(--text-placeholder);
    font-size: 12.5px;
  }
  .search-pill-box span.fake-input {
    flex: 1;
    font-size: 12.5px;
    color: var(--text-placeholder);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .search-tail-filter {
    width: 18px;
    height: 18px;
    stroke: var(--primary);
    fill: none;
    stroke-width: 2;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* Chips row */
  .chips-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 2px;
  }
  .filter-chip {
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    background: #FFFFFF;
    color: var(--text-dark);
    transition: all var(--transition-fast);
  }
  .filter-chip.active {
    background: var(--orange);
    color: #FFFFFF;
  }

  /* 4 Category Circles */
  .category-section {
    padding: 18px 18px 6px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    text-align: center;
  }
  .cat-item-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  .cat-circle {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform var(--transition-fast);
  }
  .cat-circle:active {
    transform: scale(0.95);
  }
  .cat-circle.mint {
    background: var(--mint-bg);
    color: var(--mint-text);
  }
  .cat-circle.peach {
    background: var(--peach-bg);
    color: var(--peach-text);
  }
  .cat-circle svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }
  .cat-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dark);
    line-height: 1.25;
  }

  /* Section Header */
  .section-head-row {
    padding: 16px 18px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-main-title {
    font-size: 18px;
    font-weight: 800;
    color: var(--text-dark);
    letter-spacing: -0.01em;
  }
  .section-see-all {
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    text-decoration: none;
  }

  /* Product Grid */
  .product-grid {
    padding: 0 18px 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .product-card {
    background: #FFFFFF;
    border: 1px solid var(--border-light);
    border-radius: 18px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform var(--transition-fast), box-shadow var(--transition-fast);
  }
  .product-card:active {
    transform: scale(0.98);
  }
  .card-thumb-wrap {
    height: 94px;
    border-radius: 12px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card-thumb-wrap.lavender { background: #EDEAF7; }
  .card-thumb-wrap.mint { background: var(--mint-bg); }
  .card-thumb-wrap.peach { background: var(--peach-bg); }
  .card-thumb-wrap img {
    max-width: 80%;
    max-height: 80%;
    object-fit: contain;
  }
  .card-badge-pill {
    position: absolute;
    top: 6px;
    left: 6px;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .card-badge-pill.sewa {
    background: #FFF1DE;
    color: #9A3412;
  }
  .card-badge-pill.pinjam {
    background: #EDEAF7;
    color: #6D28D9;
  }
  .card-badge-pill.beli {
    background: #DCFCE7;
    color: #166534;
  }

  .card-body-content {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .card-item-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dark);
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 34px;
  }
  .card-price-row {
    font-size: 14px;
    font-weight: 800;
  }
  .card-price-row.sewa { color: var(--orange); }
  .card-price-row.pinjam { color: var(--primary); }
  .card-price-row.beli { color: var(--primary); }
  .card-price-row .unit {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    margin-left: 1px;
  }
  .card-distance-row {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .card-distance-row svg {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    flex-shrink: 0;
  }

  /* Bottom Navigation */
  .bottom-nav-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 68px;
    background: #FFFFFF;
    border-top: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 6px 10px;
    z-index: 100;
  }
  .nav-tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-decoration: none;
    padding: 4px 10px;
  }
  .nav-tab-item.active {
    color: var(--primary);
  }
  .nav-tab-item.active .nav-icon-pill {
    background: var(--mint-bg);
    color: var(--primary);
    border-radius: 999px;
    padding: 2px 14px;
  }
  .nav-icon-pill svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.2;
  }
  .floating-plus-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--orange);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(247, 148, 45, 0.4);
    margin-top: -12px;
  }
  .floating-plus-btn svg {
    width: 24px;
    height: 24px;
    stroke: #FFFFFF;
    fill: none;
    stroke-width: 2.5;
  }

  .home-indicator {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 4px;
    background: #0F172A;
    border-radius: 2px;
    pointer-events: none;
  }

  /* Modals */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.open {
    display: flex !important;
  }
  .modal-sheet {
    background: #FFFFFF;
    border-radius: 24px 24px 0 0;
    padding: 16px 20px 28px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: slideUp 0.25s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-handle {
    width: 36px;
    height: 4px;
    background: #CBD5E1;
    border-radius: 2px;
    margin: 0 auto 6px;
  }
  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .modal-title {
    font-size: 15px;
    font-weight: 700;
    color: #0F172A;
  }
  .modal-close {
    background: #F1F5F9;
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    color: #475569;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .campus-opt {
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #E2E8F0;
    background: #FFFFFF;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #0F172A;
    cursor: pointer;
    transition: all 0.15s;
  }
  .campus-opt:hover, .campus-opt:active {
    border-color: #008F83;
    background: #F0FDF4;
    color: #008F83;
  }
</style>
</head>
<body>
<div class="phone app-frame">
  <div class="beranda-body scroll">
    <div class="teal-header-hero">
      <div class="status-bar-white">
        <span>09.41</span>
        <div class="status-icons">
          <svg width="12" height="10" viewBox="0 0 12 10" fill="currentColor"><path d="M6 1a5 5 0 0 1 3.5 1.5L6 6 2.5 2.5A5 5 0 0 1 6 1z"/></svg>
          <svg width="14" height="10" viewBox="0 0 16 12" fill="currentColor" style="margin-left:2px"><path d="M8 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM1.5 4.5a9.5 9.5 0 0 1 13 0l-1.5 1.5a7.5 7.5 0 0 0-10 0l-1.5-1.5z"/></svg>
          <svg width="18" height="10" viewBox="0 0 22 11" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-left:2px"><rect x="1" y="1" width="18" height="9" rx="2"/><path d="M20 4v3" stroke-linecap="round"/><rect x="2.5" y="2.5" width="13" height="6" fill="currentColor" stroke="none"/></svg>
        </div>
      </div>

      <div class="header-top-row">
        <div class="greeting-col">
          <div class="greeting-title" id="sapaanNama">Halo, Rina!</div>
          <button class="location-pill-btn" id="btnKampus" type="button" aria-label="Ganti lokasi">
            <svg viewBox="0 0 24 24"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/></svg>
            <span id="txtKampus">Institut Teknologi Garut</span>
            <svg viewBox="0 0 24 24" style="width:12px;height:12px"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <a href="/profil.html" class="bell-circle-btn" id="btnUserAvatar" style="overflow:hidden;padding:0;text-decoration:none;display:flex;align-items:center;justify-content:center;" aria-label="Profil Saya">
            <div id="berandaAvatarInner" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#DCFCE7;color:#007A68;border-radius:50%;">RM</div>
          </a>
          <button class="bell-circle-btn" id="btnNotif" type="button" aria-label="Notifikasi">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          </button>
        </div>
      </div>

      <!-- Search bar 1: Kos -->
      <div class="search-pill-box" id="searchKosBox">
        <svg class="search-lead-icon" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-4a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9.5z"/></svg>
        <input id="searchKosInput" type="search" placeholder="Cari kos terdekat • harga bulanan..." autocomplete="off">
        <svg class="search-tail-filter" id="filterKosBtn" viewBox="0 0 24 24" aria-label="Filter Kos"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      </div>

      <!-- Search bar 2: Barang -->
      <div class="search-pill-box">
        <svg class="search-lead-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="searchBarang" type="search" placeholder="Cari buku, laptop, alat praktikum..." autocomplete="off">
        <svg class="search-tail-filter" id="filterBarangBtn" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      </div>

      <!-- Mode Chips -->
      <div class="chips-row" id="filterChips">
        <button type="button" class="filter-chip chip active">Semua</button>
        <button type="button" class="filter-chip chip">Beli</button>
        <button type="button" class="filter-chip chip">Sewa</button>
        <button type="button" class="filter-chip chip">Pinjam</button>
      </div>
    </div>

    <!-- 4 Category Circles -->
    <div class="category-section" id="categoryList">
      <button class="cat-item-btn cat" data-cat="2" type="button">
        <div class="cat-circle mint box">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>
        <span class="cat-label">Buku &<br>Modul</span>
      </button>

      <button class="cat-item-btn cat" data-cat="1" type="button">
        <div class="cat-circle peach box">
          <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
        </div>
        <span class="cat-label">Elektronik</span>
      </button>

      <button class="cat-item-btn cat" data-cat="4" type="button">
        <div class="cat-circle mint box">
          <svg viewBox="0 0 24 24"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><line x1="8.5" y1="2" x2="15.5" y2="2"/></svg>
        </div>
        <span class="cat-label">Alat<br>Praktikum</span>
      </button>

      <button class="cat-item-btn cat" data-cat="3" type="button">
        <div class="cat-circle peach box">
          <svg viewBox="0 0 24 24"><path d="M12 2a4 4 0 0 1 4 4v1H8V6a4 4 0 0 1 4-4z"/><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 18v4"/><path d="M8 7l-2 5h12l-2-5"/></svg>
        </div>
        <span class="cat-label">Perlengkapan<br>Kos</span>
      </button>
    </div>

    <!-- Section: Dekat kamu -->
    <div class="section-head-row">
      <span class="section-main-title">Dekat kamu</span>
      <a class="section-see-all" href="/cari.html">Lihat semua</a>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="gridBarang">
      <!-- Dynamic products rendered from API via beranda.js -->
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav-bar" aria-label="Navigasi Bawah">
    <button class="nav-tab-item active" id="navBeranda" type="button">
      <div class="nav-icon-pill">
        <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-4a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9.5z"/></svg>
      </div>
      <span>Beranda</span>
    </button>

    <a class="nav-tab-item" href="/cari.html">
      <div class="nav-icon-pill">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
      <span>Cari</span>
    </a>

    <button class="floating-plus-btn" id="navTambah" type="button" aria-label="Unggah Barang">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <a class="nav-tab-item" href="/chat.html" id="navChat">
      <div class="nav-icon-pill">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <span>Chat</span>
    </a>

    <a class="nav-tab-item" href="/profil.html" id="navProfil">
      <div class="nav-icon-pill">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <span>Profil</span>
    </a>
  </nav>

  <div class="home-indicator"></div>

  <!-- Toast -->
  <div id="toast" style="display:none;position:absolute;top:20px;left:50%;transform:translateX(-50%);background:#FFFFFF;border:1px solid var(--border-light);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow-md);align-items:center;gap:8px;font-size:12px;font-weight:600;z-index:200"></div>

  <!-- Modal Kampus & Lokasi -->
  <div class="modal-overlay" id="modalKampus" role="dialog" aria-modal="true" aria-labelledby="kampusModalTitle">
    <div class="modal-backdrop" style="position:absolute;inset:0"></div>
    <div class="modal-sheet">
