<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<script src="/js/api.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusCircle — Unggah Barang</title>
<style>
  @font-face {
    font-family: 'Poppins';
    src: url('/fonts/poppins-400.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Poppins';
    src: url('/fonts/poppins-500.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Poppins';
    src: url('/fonts/poppins-600.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Poppins';
    src: url('/fonts/poppins-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --primary: #007A68;
    --primary-active: #006354;
    --text-dark: #1E3A38;
    --text-muted: #7A8583;
    --placeholder: #8A9492;
    --orange: #F28C28;
    --mint-bg: #DDF1EC;
    --peach-bg: #FFF0DB;
    --border-light: #E3E8E7;
    --card-bg: #F4F7F6;
  }

  html,body{margin:0;padding:0;background:#EAEFEF;min-height:100vh;display:flex;justify-content:center;font-family:'Poppins',system-ui,-apple-system,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  .phone{width:100%;max-width:440px;height:100vh;height:100dvh;background:#fff;margin:0 auto;position:relative;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.08)}

  /* Status Bar */
  .status{height:24px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--text-dark);flex-shrink:0;margin-top:6px}
  .status .icons{display:flex;gap:6px;align-items:center}
  .status svg{width:14px;height:14px;fill:var(--text-dark)}

  /* Header */
  .header{height:50px;padding:0 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .back-btn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
  .back-btn:hover{background:var(--card-bg)}
  .back-btn svg{width:22px;height:22px;stroke:var(--text-dark);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .header-title{font-size:18px;font-weight:700;color:var(--text-dark)}

  /* Scrollable Form Content */
  .form-scroll{flex:1;overflow-y:auto;padding:8px 20px 24px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
  .form-scroll::-webkit-scrollbar{display:none}

  /* Photo Upload Box */
  .upload-box{background:#E8F5F3;border:1.5px dashed var(--primary);border-radius:18px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:background .15s}
  .upload-box:hover{background:#DDF1EC}
  .plus-circle{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
  .plus-circle svg{width:22px;height:22px;stroke:var(--primary);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .upload-text{font-size:13px;font-weight:600;color:var(--primary)}
  .file-input{display:none}

  /* Photo Preview */
  .photo-preview{display:none;width:100%;height:160px;border-radius:18px;overflow:hidden;position:relative;background:var(--card-bg);border:1.5px solid var(--border-light);align-items:center;justify-content:center}
  .photo-preview img{width:100%;height:160px;object-fit:cover;display:block}
  .remove-photo{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(30,58,56,0.75);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1}

  /* Form Controls */
  .form-group{display:flex;flex-direction:column;gap:6px}
  .form-label{font-size:13px;font-weight:700;color:var(--text-dark)}
  .form-input{height:46px;border-radius:12px;border:1.5px solid var(--border-light);background:#fff;padding:0 14px;font-size:13px;color:var(--text-dark);outline:none;font-family:inherit;transition:border-color .15s}
  .form-input:focus{border-color:var(--primary)}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-select{height:46px;border-radius:12px;border:1.5px solid var(--border-light);background:#fff;padding:0 12px;font-size:13px;font-weight:600;color:var(--text-dark);outline:none;font-family:inherit;cursor:pointer}

  /* Transaction Mode Chips */
  .chips-row{display:flex;gap:8px}
  .type-chip{flex:1;height:38px;border-radius:999px;border:1.5px solid var(--border-light);background:#fff;font-size:13px;font-weight:700;color:var(--text-dark);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;font-family:inherit}
  .type-chip.active{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 2px 6px rgba(242,140,40,0.25)}

  /* Smart Price Estimator Card */
  .smart-price-card{background:var(--primary);border-radius:20px;padding:16px 18px;color:#fff;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 16px rgba(0,122,104,0.25);transition:opacity .2s}
  .smart-top{display:flex;align-items:center;gap:10px}
  .sparkle-badge{width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .sparkle-badge svg{width:18px;height:18px;fill:var(--orange);stroke:var(--orange)}
  .smart-title{font-size:14px;font-weight:700;color:#fff}
  .smart-sub{font-size:11px;color:rgba(255,255,255,0.85)}

  .smart-price-val{font-size:22px;font-weight:800;letter-spacing:-0.3px}
  .smart-subline{font-size:12px;color:rgba(255,255,255,0.9);margin-top:-6px}

  /* Slider graphic */
  .slider-box{display:flex;flex-direction:column;gap:6px;margin-top:2px}
  .slider-bar-wrap{position:relative;height:8px;background:rgba(255,255,255,0.25);border-radius:999px;display:flex;align-items:center}
  .slider-active-range{position:absolute;left:25%;right:25%;height:8px;background:var(--orange);border-radius:999px}
  .slider-thumb{position:absolute;left:50%;top:50%;transform:translate(-50%, -50%);width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.2)}
  .slider-labels{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,0.8);font-weight:600}

  /* User Price Input */
  .price-input-custom{border:1.5px solid var(--primary);font-weight:700;color:var(--text-dark)}

  /* Submit Button */
  .submit-btn{height:50px;border-radius:18px;background:var(--primary);color:#fff;border:none;outline:none;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,122,104,0.3);margin-top:6px;transition:background .15s, transform .15s;font-family:inherit}
  .submit-btn:active{transform:scale(0.98);background:var(--primary-active)}

  .toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(30,58,56,0.92);color:#fff;padding:8px 18px;border-radius:999px;font-size:12px;font-weight:600;z-index:60;display:none;align-items:center;gap:6px}
</style>
</head>
<body>

<div class="phone">
  <div class="toast" id="toastMsg">
    <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.2"><path d="m5 12 4 4L19 6"/></svg>
    <span id="toastText">Barang berhasil ditayangkan!</span>
  </div>

  <div class="status">
    <span>09:41</span>
    <div class="icons">
      <svg viewBox="0 0 24 24"><path d="M2 17h3v5H2zm5-4h3v9H7zm5-4h3v13h-3zm5-5h3v18h-3z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.24 4.24 0 00-6 0zm-4-4l2 2a7.07 7.07 0 0110 0l2-2C15.95 9.05 8.05 9.05 5 13z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </div>
  </div>

  <div class="header">
    <button class="back-btn" id="backBtn" aria-label="Kembali">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h1 class="header-title">Unggah Barang</h1>
  </div>

  <div class="form-scroll">
    <!-- Photo Upload Box -->
    <div class="upload-box" id="uploadBox">
      <div class="plus-circle">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div class="upload-text" id="uploadText">Tambah foto barang (1 – 3 foto, min. 1)</div>
    </div>
    <input type="file" id="photoInput" accept="image/*" multiple hidden>
    <div id="photoPreviewList" style="display:flex;flex-direction:row;gap:10px;flex-wrap:wrap"></div>

    <!-- Nama Barang -->
    <div class="form-group">
      <label class="form-label" for="namaBarang">Nama Barang</label>
      <input type="text" class="form-input" id="namaBarang" placeholder="Misal: Kalkulator Scientific Casio, Modul Kalkulus, Jas Lab">
    </div>

    <!-- Lokasi Pemilik (Point 6: Untuk estimasi jarak) -->
    <div class="form-group">
      <label class="form-label" for="lokasiBarang">Lokasi Pemilik / Kampus</label>
      <input type="text" class="form-input" id="lokasiBarang" placeholder="Misal: Fakultas Teknik, Gedung C, Kos Dekat ITG" value="Fakultas Teknik, ITG">
    </div>

    <!-- Koordinat Lokasi (Latitude & Longitude untuk estimasi jarak) -->
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label" for="lokasiLat">Latitude</label>
        <input type="number" class="form-input" id="lokasiLat" step="any" placeholder="-6.89" value="-6.8950">
      </div>
      <div class="form-group">
        <label class="form-label" for="lokasiLng">Longitude</label>
        <input type="number" class="form-input" id="lokasiLng" step="any" placeholder="107.61" value="107.6100">
      </div>
    </div>

    <!-- Kategori & Kondisi -->
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label" for="kategoriSelect">Kategori</label>
        <select class="form-select" id="kategoriSelect">
          <option value="1">Elektronik</option>
          <option value="2">Buku & Modul</option>
          <option value="4">Alat Praktikum</option>
          <option value="5">Olahraga</option>
          <option value="3">Perabot Kos</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="kondisiSelect">Kondisi</label>
        <select class="form-select" id="kondisiSelect">
          <option value="baru">Seperti baru</option>
          <option value="baik" selected>Baik</option>
          <option value="cukup">Cukup</option>
          <option value="rusak">Perlu perbaikan</option>
        </select>
      </div>
    </div>

    <!-- Jenis Transaksi -->
    <div class="form-group">
      <label class="form-label">Jenis Transaksi</label>
      <div class="chips-row" id="typeChips">
        <button type="button" class="type-chip" data-type="jual">Jual</button>
        <button type="button" class="type-chip active" data-type="sewa">Sewa</button>
        <button type="button" class="type-chip" data-type="pinjam">Pinjam</button>
      </div>
    </div>

    <!-- Smart Price Estimator Card -->
    <div class="smart-price-card" id="smartPriceCard">
      <div class="smart-top">
        <div class="sparkle-badge">
          <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </div>
        <div style="flex:1">
          <div class="smart-title">Smart Price Estimator</div>
          <div class="smart-sub" id="smartPriceSub">Rekomendasi harga sewa</div>
        </div>
        <button type="button" id="btnPakaiIdeal" style="background:rgba(255,255,255,0.22);border:none;color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;cursor:pointer">Pakai Ideal</button>
      </div>

      <div class="smart-price-val" id="smartPriceRange">Rp4.000 – Rp6.000</div>
      <div class="smart-subline" id="smartPriceIdeal">/ hari · harga ideal Rp5.000</div>

      <div class="slider-box">
        <div class="slider-bar-wrap">
          <div class="slider-active-range"></div>
          <div class="slider-thumb"></div>
        </div>
        <div class="slider-labels">
          <span>Murah</span>
          <span>Mahal</span>
        </div>
      </div>
    </div>

    <!-- Harga Input -->
    <div class="form-group" id="hargaGroup">
      <label class="form-label" id="hargaLabel">Harga Sewa Kamu (per hari)</label>
      <input type="number" class="form-input price-input-custom" id="hargaInput" placeholder="Masukkan harga sewa (misal: 5000)">
    </div>

    <!-- Deskripsi Opsional -->
    <div class="form-group">
      <label class="form-label" for="deskripsiInput">Deskripsi (Opsional)</label>
      <input type="text" class="form-input" id="deskripsiInput" placeholder="Jelaskan kondisi dan kelengkapan barang...">
    </div>

    <button type="button" class="submit-btn" id="submitBtn">Tayangkan Barang</button>
  </div>
</div>

<script src="/js/unggah.js"></script>
</body>
</html>
