<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KampusCircle — Cari Barang</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .cari-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: none;
    display: flex;
    flex-direction: column;
    padding: 10px 18px 80px;
    background: #F8FAFC;
  }
  .cari-body::-webkit-scrollbar { display: none; }

  .status-bar {
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: #0F172A;
  }
  .status-icons {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
  }

  /* Header */
  .cari-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    margin-bottom: 16px;
    height: 36px;
  }
  .header-back-btn {
    width: 36px;
    height: 36px;
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    color: var(--text-dark);
  }
  .header-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-dark);
  }
  .header-loc-btn {
    width: 36px;
    height: 36px;
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    color: var(--text-dark);
  }

  /* Search Input Pill */
  .search-input-pill {
    background: #FFFFFF;
    border: 1.5px solid var(--primary);
    border-radius: 16px;
    height: 48px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(0, 143, 131, 0.08);
  }
  .search-input-pill svg.search-ico {
    width: 18px;
    height: 18px;
    stroke: var(--primary);
    fill: none;
    stroke-width: 2.2;
    flex-shrink: 0;
  }
  .search-input-pill input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 14px;
    color: var(--text-dark);
    font-family: inherit;
    background: transparent;
  }
  .search-input-pill .clear-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 2px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
  }

  /* Filter Chips Row */
  .filter-chips-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-chips-row::-webkit-scrollbar { display: none; }
  .btn-filter-toggle {
    background: var(--primary);
    color: #FFFFFF;
    border: none;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .btn-filter-toggle svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }
  .chip-tag-pill {
    background: #FFFFFF;
    border: 1px solid var(--border-light);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dark);
    white-space: nowrap;
    flex-shrink: 0;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .chip-tag-pill.active {
    background: #DCFCE7;
    border-color: #86EFAC;
    color: #166534;
  }
  .chip-tag-pill .chip-close {
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    margin-left: 2px;
    opacity: 0.75;
  }
  .chip-tag-pill:hover .chip-close {
    opacity: 1;
  }
  .header-loc-btn.active {
    color: #059669;
  }

  /* Custom SweetAlert2 Tailwind Styles */
  .swal2-popup.rounded-2xl {
    border-radius: 1rem !important;
    font-family: inherit !important;
  }
  .swal2-popup.shadow-xl {
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1) !important;
  }
  .swal2-popup.border-0 {
    border: none !important;
  }
  .swal2-title.text-xl {
    font-size: 1.25rem !important;
    line-height: 1.75rem !important;
  }
  .swal2-title.font-bold {
    font-weight: 700 !important;
  }
  .swal2-title.text-gray-800 {
    color: #1f2937 !important;
  }
  .swal2-html-container.text-gray-600 {
    color: #4b5563 !important;
  }
  .swal2-html-container.font-medium {
    font-weight: 500 !important;
  }
  .swal2-confirm.bg-\[\#059669\] {
    background-color: #059669 !important;
  }
  .swal2-confirm.text-white {
    color: #ffffff !important;
  }
  .swal2-confirm.px-8 {
    padding-left: 2rem !important;
    padding-right: 2rem !important;
  }
  .swal2-confirm.py-2\.5 {
    padding-top: 0.625rem !important;
    padding-bottom: 0.625rem !important;
  }
  .swal2-confirm.rounded-xl {
    border-radius: 0.75rem !important;
  }
  .swal2-confirm.font-semibold {
    font-weight: 600 !important;
  }
  .swal2-confirm.hover\:bg-emerald-700:hover {
    background-color: #047857 !important;
  }
  .swal2-confirm.transition-colors {
    transition: background-color 0.15s ease, color 0.15s ease !important;
    cursor: pointer !important;
    outline: none !important;
    border: none !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
  .swal2-cancel.bg-gray-100 {
    background-color: #f3f4f6 !important;
  }
  .swal2-cancel.text-gray-700 {
    color: #374151 !important;
  }
  .swal2-cancel.px-6 {
    padding-left: 1.5rem !important;
    padding-right: 1.5rem !important;
  }
  .swal2-cancel.py-2\.5 {
    padding-top: 0.625rem !important;
    padding-bottom: 0.625rem !important;
  }
  .swal2-cancel.rounded-xl {
    border-radius: 0.75rem !important;
  }
  .swal2-cancel.font-semibold {
    font-weight: 600 !important;
  }
  .swal2-cancel.hover\:bg-gray-200:hover {
    background-color: #e5e7eb !important;
  }
  .swal2-cancel.transition-colors {
    transition: background-color 0.15s ease, color 0.15s ease !important;
    cursor: pointer !important;
    outline: none !important;
    border: none !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
  }

  /* Result header row */
  .result-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
    margin-bottom: 12px;
  }
  .result-count-text {
    font-size: 13px;
    font-weight: 800;
    color: var(--text-dark);
  }
  .sort-dropdown-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
  }
  .sort-dropdown-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.2;
  }

  /* Horizontal card items list */
  .cards-vertical-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .horizontal-item-card {
    background: #FFFFFF;
    border: 1px solid var(--border-light);
    border-radius: 18px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform var(--transition-fast);
  }
  .horizontal-item-card:active {
    transform: scale(0.98);
  }
  .card-left-thumb {
    width: 82px;
    height: 82px;
    border-radius: 14px;
    background: #EDEAF7;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .card-left-thumb img {
    max-width: 85%;
    max-height: 85%;
    object-fit: contain;
  }
  .card-right-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .badge-tag-sm {
    align-self: flex-start;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .badge-tag-sm.sewa { background: #FFF1DE; color: #9A3412; }
  .badge-tag-sm.beli { background: #DCFCE7; color: #166534; }
  .badge-tag-sm.pinjam { background: #EDEAF7; color: #6D28D9; }

  .card-title-text {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-price-text {
    font-size: 14px;
    font-weight: 800;
    color: var(--primary);
  }
  .card-price-text.orange {
    color: var(--orange);
  }
  .card-location-row {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .card-location-row svg {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    flex-shrink: 0;
  }

  /* Community banner */
  .community-banner {
    margin-top: 14px;
    background: #E6F4F1;
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .community-banner svg {
    width: 20px;
    height: 20px;
    stroke: var(--primary);
    fill: none;
    stroke-width: 2;
    flex-shrink: 0;
  }
  .community-banner p {
    font-size: 11px;
    color: #0F766E;
    line-height: 1.4;
    margin: 0;
  }

  /* Bottom Navigation */
  .bottom-nav-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 68px;
    background: #FFFFFF;
    border-top: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 6px 10px;
    z-index: 100;
  }
  .nav-tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-decoration: none;
    padding: 4px 10px;
  }
  .nav-tab-item.active {
    color: var(--primary);
  }
  .nav-tab-item.active .nav-icon-pill {
    background: var(--mint-bg);
    color: var(--primary);
    border-radius: 999px;
    padding: 2px 14px;
  }
  .nav-icon-pill svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.2;
  }
  .floating-plus-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--orange);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(247, 148, 45, 0.4);
    margin-top: -12px;
  }
  .floating-plus-btn svg {
    width: 24px;
    height: 24px;
    stroke: #FFFFFF;
    fill: none;
    stroke-width: 2.5;
  }
  .home-indicator {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 4px;
    background: #0F172A;
    border-radius: 2px;
    pointer-events: none;
  }

  /* Modal Bottom Sheet: Filter Pencarian */
  .filter-sheet-overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.4);
    z-index: 200;
    display: none;
    align-items: flex-end;
  }
  .filter-sheet-overlay.open {
    display: flex;
  }
  .filter-sheet-panel {
    width: 100%;
    max-height: 92%;
    background: #FFFFFF;
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 16px 20px 24px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    scrollbar-width: none;
    gap: 14px;
  }
  .filter-sheet-panel::-webkit-scrollbar { display: none; }
  .sheet-handle-bar {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: #CBD5E1;
    margin: 0 auto 6px;
  }
  .filter-nav-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .f-head-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-dark);
  }
  .f-headline-big {
    font-size: 24px;
    font-weight: 800;
    color: var(--text-dark);
    line-height: 1.2;
    margin-top: 6px;
  }
  .f-headline-sub {
    font-size: 13px;
    color: var(--text-muted);
  }

  .f-chips-group {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
  }
  .f-pill-opt {
    padding: 6px 16px;
    border-radius: 999px;
    border: 1px solid var(--border-light);
    background: #FFFFFF;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dark);
    cursor: pointer;
  }
  .f-pill-opt.active {
    background: var(--orange);
    color: #FFFFFF;
    border-color: var(--orange);
  }

  .f-field-lbl {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 6px;
    display: block;
  }
  .f-input-box {
    width: 100%;
    height: 46px;
    border: 1.5px solid var(--border-light);
    border-radius: var(--radius-md);
    padding: 0 14px;
    font-size: 13.5px;
    color: var(--text-dark);
    font-family: inherit;
  }
  .f-price-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .f-bottom-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
    padding-top: 10px;
    border-top: 1px solid var(--border-light);
  }
  .f-btn-reset {
    height: 48px;
    background: #FFFFFF;
    border: 1.5px solid var(--primary);
    color: var(--primary);
    border-radius: 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .f-btn-submit {
    height: 48px;
    background: var(--primary);
    border: none;
    color: #FFFFFF;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>

    <div class="status-bar">
      <span>09.41</span>
      <div class="status-icons">
        <svg width="12" height="10" viewBox="0 0 12 10" fill="currentColor"><path d="M6 1a5 5 0 0 1 3.5 1.5L6 6 2.5 2.5A5 5 0 0 1 6 1z"/></svg>
        <svg width="14" height="10" viewBox="0 0 16 12" fill="currentColor" style="margin-left:2px"><path d="M8 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM1.5 4.5a9.5 9.5 0 0 1 13 0l-1.5 1.5a7.5 7.5 0 0 0-10 0l-1.5-1.5z"/></svg>
        <svg width="18" height="10" viewBox="0 0 22 11" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-left:2px"><rect x="1" y="1" width="18" height="9" rx="2"/><path d="M20 4v3" stroke-linecap="round"/><rect x="2.5" y="2.5" width="13" height="6" fill="currentColor" stroke="none"/></svg>

    <!-- Header -->
    <div class="cari-header">
      <button class="header-back-btn" id="backBtn" type="button" aria-label="Kembali">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>

      </button>

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

    <div class="result-header-row">

  <!-- Bottom Navigation -->
  <nav class="bottom-nav-bar" aria-label="Navigasi Bawah">

      <div class="sheet-handle-bar"></div>
      <div class="filter-nav-head">
        <button type="button" id="closeFilterBtn" style="background:transparent;border:none;cursor:pointer;color:var(--text-dark);padding:0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <span class="f-head-title">Filter Pencarian</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </div>

      <div class="f-headline-big">Temukan yang pas.</div>
      <div class="f-headline-sub">Pilihan transaksi bersifat eksklusif.</div>

      <!-- Mode Chips -->
      <div class="f-chips-group" id="filterModeChips">
        <button type="button" class="f-pill-opt active" data-mode="all">Semua</button>
        <button type="button" class="f-pill-opt" data-mode="sewa">Sewa</button>
        <button type="button" class="f-pill-opt" data-mode="beli">Beli</button>
        <button type="button" class="f-pill-opt" data-mode="pinjam">Pinjam Free</button>
      </div>

      <!-- Kategori -->
      <div>
        <label class="f-field-lbl" for="filterKategori">Kategori</label>
        <select class="f-input-box" id="filterKategori" style="background:#fff;">
          <option value="">Semua kategori</option>
          <option value="1">Elektronik</option>
          <option value="2">Buku & Diktat</option>
          <option value="3">Perlengkapan Kos</option>
          <option value="4">Alat Lab / Praktikum</option>
          <option value="5">Olahraga & Outdoor</option>
          <option value="lainnya">Lainnya</option>
        </select>
      </div>

      <!-- Rentang Harga (Min - Max) -->
      <div class="f-price-grid">
        <div>
          <label class="f-field-lbl" for="filterMinPrice">Minimum</label>
          <input class="f-input-box" id="filterMinPrice" type="text" value="" placeholder="Rp0">
        </div>
        <div>
          <label class="f-field-lbl" for="filterMaxPrice">Maksimum</label>
          <input class="f-input-box" id="filterMaxPrice" type="text" value="" placeholder="Tanpa batas">
        </div>
      </div>

      <!-- Slider Rentang Harga -->
      <div class="range-container" id="priceRangeContainer">
        <div class="range-track"></div>
        <div class="range-highlight" id="priceRangeHighlight"></div>
        <div class="range-thumb left" id="priceThumbLeft" role="slider" tabindex="0" aria-label="Harga minimum"></div>
        <div class="range-thumb right" id="priceThumbRight" role="slider" tabindex="0" aria-label="Harga maksimum"></div>
      </div>

      <!-- Lokasi Pencarian -->
      <div>
        <label class="f-field-lbl" for="filterLokasi">Lokasi pencarian</label>
        <input class="f-input-box" id="filterLokasi" type="text" value="Institut Teknologi Garut">
      </div>

      <!-- Jarak Maksimum -->
      <div>
        <label class="f-field-lbl">Jarak maksimum</label>
        <div class="f-chips-group" id="filterDistChips">
          <button type="button" class="f-pill-opt" data-dist="1">1 km</button>
          <button type="button" class="f-pill-opt" data-dist="2">2 km</button>
          <button type="button" class="f-pill-opt" data-dist="5">5 km</button>
          <button type="button" class="f-pill-opt active" data-dist="all">Semua</button>
        </div>
      </div>

      <!-- Kondisi Barang -->
      <div>
        <label class="f-field-lbl">Kondisi barang</label>
        <div class="f-chips-group" id="filterCondChips">
          <button type="button" class="f-pill-opt active" data-cond="all">Semua</button>
          <button type="button" class="f-pill-opt" data-cond="baru">Seperti baru</button>
          <button type="button" class="f-pill-opt" data-cond="baik">Baik</button>
        </div>
      </div>

      <!-- Urutkan -->
      <div>
        <label class="f-field-lbl" for="filterSort">Urutkan</label>
        <input class="f-input-box" id="filterSort" type="text" value="Jarak terdekat" readonly>
      </div>

      <!-- Bottom Actions -->
      <div class="f-bottom-actions">
        <button type="button" class="f-btn-reset" id="filterResetBtn">Atur ulang</button>
        <button type="button" class="f-btn-submit" id="filterApplyBtn">Terapkan filter</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/js/cari.js"></script>
</body>
</html>
