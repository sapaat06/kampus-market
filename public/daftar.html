<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KampusCircle — Daftar</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .daftar-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    padding: 14px 20px 36px;
    display: flex;
    flex-direction: column;
    scrollbar-width: none;
  }
  .daftar-body::-webkit-scrollbar {
    display: none;
  }
  .status-bar {
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: #0F172A;
  }
  .status-icons {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
  }
  .top-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    margin-bottom: 22px;
    height: 32px;
  }
  .header-logo-img {
    height: 26px;
    width: auto;
    object-fit: contain;
  }
  .bell-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    color: var(--text-dark);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .headline-title {
    font-size: 24px;
    font-weight: 800;
    color: var(--text-dark);
    line-height: 1.25;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .headline-sub {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.45;
    margin-bottom: 20px;
  }
  .form-group {
    margin-bottom: 12px;
  }
  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 5px;
  }
  .form-input {
    width: 100%;
    height: 48px;
    background: #FFFFFF;
    border: 1.5px solid var(--border-light);
    border-radius: var(--radius-md);
    padding: 0 14px;
    font-size: 13px;
    color: var(--text-dark);
    font-family: inherit;
  }
  .form-input::placeholder {
    color: var(--text-placeholder);
    font-size: 13px;
  }
  .form-input:focus {
    outline: none;
    border-color: var(--primary);
  }
  .password-input-wrap {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
  }
  .password-input-wrap .form-input {
    padding-right: 44px;
  }
  .eye-toggle-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    cursor: pointer;
    color: #64748B;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    transition: color 0.15s ease;
  }
  .eye-toggle-btn:hover {
    color: var(--primary);
  }
  .form-helper {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .agree-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: 10px;
    margin-bottom: 16px;
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.35;
    cursor: pointer;
  }
  .agree-row input[type="checkbox"] {
    margin-top: 2px;
    accent-color: var(--primary);
    width: 14px;
    height: 14px;
  }
  #btnDaftar {
    height: 50px;
    margin-top: 0;
    font-size: 15px;
    font-weight: 700;
  }
  .mint-info-banner {
    background: var(--mint-bg);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    height: 50px;
  }
  .mint-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .mint-icon svg {
    width: 14px;
    height: 14px;
    stroke: var(--mint-text);
    fill: none;
    stroke-width: 2.2;
  }
  .mint-text-wrap {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .mint-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--mint-text);
  }
  .mint-desc {
    font-size: 11px;
    color: var(--text-muted);
  }
  .home-indicator {
    width: 134px;
    height: 4px;
    background: #0F172A;
    border-radius: 2px;
    margin: 12px auto 0;
  }
</style>
</head>
<body>
<div class="phone app-frame">
  <div class="daftar-body">
    <div class="status-bar">
      <span>09.41</span>
      <div class="status-icons">
        <svg width="12" height="10" viewBox="0 0 12 10" fill="currentColor"><path d="M6 1a5 5 0 0 1 3.5 1.5L6 6 2.5 2.5A5 5 0 0 1 6 1z"/></svg>
        <span style="font-size:10px;font-weight:bold;margin-left:2px">LTE</span>
        <svg width="18" height="10" viewBox="0 0 22 11" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-left:2px"><rect x="1" y="1" width="18" height="9" rx="2"/><path d="M20 4v3" stroke-linecap="round"/><rect x="2.5" y="2.5" width="13" height="6" fill="currentColor" stroke="none"/></svg>
      </div>
    </div>

    <div class="top-header">
      <a href="/"><img src="/img/logo-campuscircle.png?v=3" alt="KampusCircle" class="header-logo-img" style="cursor:pointer"></a>
      <button class="bell-btn" type="button" aria-label="Notifikasi">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </button>
    </div>

    <div class="headline-title">Yuk, jadi bagian dari<br>KampusCirle!</div>
    <div class="headline-sub">Buat akun untuk mulai mencari dan berbagi kebutuhan kampusmu.</div>

    <form id="formDaftar" action="/verifikasi.html" method="POST">
      <div class="form-group">
        <label class="form-label">Pilihan Pendaftaran</label>
        <div style="display:flex;gap:8px;margin-bottom:6px">
          <label style="flex:1;display:flex;align-items:center;gap:8px;padding:10px 12px;background:#FFFFFF;border:1.5px solid var(--border-light);border-radius:var(--radius-md);cursor:pointer;font-size:12px;font-weight:600;color:var(--text-dark)">
            <input type="radio" name="roleDaftar" id="roleMhs" value="mahasiswa" checked style="accent-color:var(--primary);width:16px;height:16px">
            <span>Daftar sebagai Mahasiswa</span>
          </label>
          <label style="flex:1;display:flex;align-items:center;gap:8px;padding:10px 12px;background:#FFFFFF;border:1.5px solid var(--border-light);border-radius:var(--radius-md);cursor:pointer;font-size:12px;font-weight:600;color:var(--text-dark)">
            <input type="radio" name="roleDaftar" id="roleKost" value="pemilik_kost" style="accent-color:var(--primary);width:16px;height:16px">
            <span>Daftar sebagai Pemilik Kost</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="daftarNama">Nama lengkap</label>
        <input id="daftarNama" class="form-input" type="text" placeholder="Masukkan nama sesuai identitas" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="daftarEmail">Email</label>
        <input id="daftarEmail" class="form-input" type="email" placeholder="Masukkan email aktif kamu" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="daftarNoHp">Nomor WhatsApp</label>
        <input id="daftarNoHp" class="form-input" type="tel" inputmode="numeric" placeholder="Masukkan nomor WA aktif (contoh: 081234567890)" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="daftarPass">Kata sandi</label>
        <div class="password-input-wrap">
          <input id="daftarPass" class="form-input" type="password" placeholder="Buat kata sandi" required minlength="8">
          <button type="button" class="eye-toggle-btn" id="eyeDaftarPass" aria-label="Tampilkan kata sandi">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="form-helper">Minimal 8 karakter, kombinasi huruf dan angka.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="daftarPass2">Konfirmasi kata sandi</label>
        <div class="password-input-wrap">
          <input id="daftarPass2" class="form-input" type="password" placeholder="Ulangi kata sandi" required minlength="8">
          <button type="button" class="eye-toggle-btn" id="eyeDaftarPass2" aria-label="Tampilkan kata sandi">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <label class="agree-row">
        <input type="checkbox" id="agreeCheck" required checked>
        <span>Saya menyetujui Syarat & Ketentuan serta Kebijakan Privasi KampusCircle.</span>
      </label>

      <button id="btnDaftar" class="btn-primary" type="submit">Daftar</button>

      <div class="mint-info-banner">
        <div class="mint-icon">
          <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="mint-text-wrap">
          <div class="mint-title">Setelah daftar, verifikasi mahasiswamu</div>
          <div class="mint-desc">Identitas aktif membantu lingkaran kampus</div>
        </div>
      </div>

      <div style="margin-top: 14px; text-align: center;">
        <span style="font-size: 11px; color: #64748B;">Khusus pemilik hunian:</span>
        <a href="/daftar-kost.html" style="font-size: 11px; font-weight: 700; color: #007A68; text-decoration: none; margin-left: 4px;">Daftar di Portal Pemilik Kost →</a>
      </div>
    </form>
    <div class="home-indicator"></div>
  </div>
</div>
<script src="/vendor/sweetalert2.all.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/daftar.js"></script>
</body>
</html>
